name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate (stable)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Download vendored grammars
        shell: bash
        run: bash scripts/bootstrap-vendored-grammars.sh

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,cargo-audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check licenses and advisories
        run: cargo deny check

      - name: Check unused dependencies
        run: cargo machete

      - name: Audit vulnerabilities
        run: cargo audit

  msrv:
    name: MSRV Check (1.88)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned toolchains are only supported via the toolchain input on
      # @master; the @stable channel tag does not accept it.
      - name: Install Rust toolchain (1.88)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Download vendored grammars
        shell: bash
        run: bash scripts/bootstrap-vendored-grammars.sh

      - name: Check compilation against MSRV
        run: cargo check --workspace --all-targets
